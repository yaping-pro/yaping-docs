name: Build & Deploy OINK to Virtual Host

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-matrixidc
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build Production Static Site
        run: hugo --gc --minify --environment production --printPathWarnings

      - name: Deploy to MatrixIDC via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 186.241.115.49
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./public/
          server-dir: ./public_html/
          dangerous-clean-slate: false
